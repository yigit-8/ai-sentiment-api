name: Sync to Hugging Face
on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for Node.js 24 compatibility
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret is not set. The Hugging Face Space cannot be synced without it - set the HF_TOKEN repository secret and re-run this workflow." >&2
            exit 1
          fi

          # Commit identity uses the GitHub no-reply address
          git config --global user.email "yliman@users.noreply.github.com"
          git config --global user.name "yliman"

          # The Space is a one-way mirror of this repository, so a force push is correct here.
          git push --force "https://yliman:$HF_TOKEN@huggingface.co/spaces/yliman/ai-sentiment-api" main
